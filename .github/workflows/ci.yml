name: LaunchStack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchstack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d launchstack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Initialize test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres \
            -d launchstack_test \
            -v ON_ERROR_STOP=1 \
            -f database/launchstack_test.sql

      - name: Create test environment
        working-directory: backend
        run: |
          cat > ../.env.test <<'EOF'
          NODE_ENV=test
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=launchstack_test
          DB_USER=postgres
          DB_PASSWORD=postgres
          JWT_SECRET=ci-only-test-secret-not-for-production
          ALLOWED_FRONTEND_ORIGINS=http://localhost:3000
          EOF

      - name: Run backend tests
        working-directory: backend
        run: bun test

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend
        run: bun run lint

      - name: Run TypeScript check
        working-directory: frontend
        run: bun run tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: bun run build
